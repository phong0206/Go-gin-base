root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/ticket-service ."
bin = "tmp/ticket-service"
delay = 1000
exclude_dir = ["tmp", "vendor", "storage", "bin"]
include_ext = ["go", "tpl", "tmpl", "html"]
stop_on_error = true
send_interrupt = true
kill_delay = 500

[log]
time = true

[screen]
clear_on_rebuild = true
